name: Build and Deploy Bike Frontend

on:
  push:
    branches: [ main ]
    # Only trigger this workflow if files inside the frontend folder change
    paths:
      - 'frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        # Tells the caching mechanism to look inside the frontend subfolder
        cache-dependency-path: ./frontend/package-lock.json
    
    # Clean install and build production files inside the frontend folder
    - name: Install and Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
    
    # Deploy the dist folder generated inside the frontend folder
    - name: FTP Deploy to Bluehost
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.FTP_PASSWORD }} 
        port: 21
        protocol: ftps
        local-dir: ./frontend/dist/
        server-dir: ./bike.jpwillenborg.com/
